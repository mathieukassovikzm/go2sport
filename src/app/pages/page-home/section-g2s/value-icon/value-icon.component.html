<div class="value-icon" [class.hovered]="isHover()" (mouseover)="hoverIn()" (mouseout)="hoverOut()">
  <div class="value-icon-title">
    <h4>{{value().title}}</h4>
  </div>
  <div class="value-icon-icon">
    <app-svg-circle />
    @if (isSolidarite()) {
      <app-svg-solidarite />
    }
    @if (isPartage()) {
      <app-svg-partage />
    }
    @if (isTolerance()) {
      <app-svg-tolerance />
    }
    @if (isConvivialite()) {
      <app-svg-convivialite />
    }
  </div>
